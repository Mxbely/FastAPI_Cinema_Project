[project]
name = "fastapi-cinema-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Max",email = "mxbely98@gmail.com"}
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.6"
sqlalchemy = "^2.0.36"
pytest = "^8.3.4"
pydantic-settings = "^2.7.0"
pandas = "^2.2.3"
tqdm = "^4.67.1"
uvicorn = "^0.34.0"
httpx = "^0.28.1"
pytest-env = "^1.1.5"
flake8 = "^7.1.1"
psycopg2-binary = "^2.9.10"
alembic = "^1.14.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
email-validator = "^2.2.0"
bcrypt = "4.0.1"
jinja2 = "^3.1.5"
pytest-order = "^1.3.0"
beautifulsoup4 = "^4.12.3"
validators = "^0.34.0"
boto3 = "^1.36.2"
botocore = "^1.36.2"
pillow = "^11.1.0"
python-multipart = "^0.0.20"
gunicorn = "^23.0.0"
black = "^25.1.0"
stripe = "^11.5.0"
mypy = "^1.14.1"


[tool.poetry.group.dev.dependencies]
ruff = "^0.9.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",  # PEP8 naming convetions
    "D"  # pydocstyle
]
ignore = [
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "D",  # pydocstyle
    "F401",
    "B904",
    "N802",
    "B008",
    "F821",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
disable_error_code = [
    "misc",
    "name-defined",
    "valid-type",
]
python_version = "3.10"
ignore_missing_imports = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
explicit_package_bases = true
exclude = [
    "src/database/migrations/.*",
    "src/config/settings.py",
    "src/tests/.*",
]