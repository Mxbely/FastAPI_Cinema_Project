name: CI

on:
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Clean mypy cache
        run: rm -rf .mypy_cache

      - name: ls
        run: ls
      - name: List files for debugging
        run: |
          ls -R

      - name: Check Python version
        run: |
          python --version

      - name: Run mypy with config file
        run: |
          poetry run mypy . --config-file ./mypy.ini --exclude "src/database/migrations/.*|src/config/.*|src/tests/.*|src/database/session_postgresql.py$"

      - name: Run mypy
        run: poetry run mypy . --config-file mypy.ini --exclude "^src/database/migrations/.*|^src/config/.*|^src/tests/.*|src/database/session_postgresql.py$"

      - name: Run Ruff linter
        continue-on-error: true
        run: poetry run ruff check
